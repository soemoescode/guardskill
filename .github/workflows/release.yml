name: Release

# Tag-only. Never triggered by a pull request, so a fork cannot reach the
# publish step or the OIDC token behind it.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm test

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # npm provenance, via OIDC. No long-lived token.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
      - name: npm CLI new enough for trusted publishing
        run: npm install -g npm@^11.5.1
      - name: Tag and package version must match
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          echo "tag=$tag package=$pkg"
          test "$tag" = "$pkg"
      - name: Refuse to publish a placeholder
        run: node -e "const p=require('./package.json'); if(/REPLACE_|<your|TODO/i.test(JSON.stringify(p))) { throw new Error('package.json still contains a placeholder'); }"
      # Trusted publishing. npm authenticates this workflow through the OIDC
      # token granted by `id-token: write` above, so no publish credential is
      # stored in a repository secret -- which is the same class of problem this
      # tool reports in other repositories.
      - run: npm publish --provenance --access public
